<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apply for Strategy Session — MODA STUDIO.AI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=DM+Sans&display=swap" rel="stylesheet" />
<style>
body{font-family:'DM Sans',sans-serif;background:#f5f0e8;color:#1c1a15}
.wrap{max-width:900px;margin:0 auto;padding:40px}
input,textarea,select{width:100%;padding:10px;margin:8px 0}
.btn{padding:12px 20px;border:none;cursor:pointer}
.btn-dark{background:#18160f;color:#fff}
.error{color:#8c5c3c}
</style>
</head>

<body>

<div class="wrap">
<h1>Apply for a MODA Strategy Session</h1>

<form id="form">
<input name="full_name" placeholder="Full Name" required>
<input name="brand_name" placeholder="Brand Name" required>
<input name="email" type="email" placeholder="Email" required>
<textarea name="why_applying_now" placeholder="Why are you applying now?" required></textarea>

<div class="error" id="error"></div>
<button class="btn btn-dark" type="submit">Submit Application</button>
</form>

<div id="success" style="display:none;">
<h2>Application submitted.</h2>
</div>
</div>

<!-- REQUIRED CONFIG -->
<script>
window.MODA_STRATEGY_INTAKE_ENDPOINT = "http://localhost:3001/api/webhooks/strategy-intake";
window.MODA_STRATEGY_INTAKE_WEBHOOK_SECRET = "";
</script>

<script>
const form = document.getElementById('form');
const errorEl = document.getElementById('error');
const success = document.getElementById('success');

function makeId(){
return crypto.randomUUID();
}

async function submitQualification(payload){
const endpoint = String(window.MODA_STRATEGY_INTAKE_ENDPOINT || '').trim();
if(!endpoint){
throw new Error('Endpoint not configured');
}

const secret = String(window.MODA_STRATEGY_INTAKE_WEBHOOK_SECRET || '').trim();
const headers = {'Content-Type':'application/json'};
if(secret) headers['x-webhook-secret'] = secret;

let res;
try{
res = await fetch(endpoint,{
method:'POST',
headers,
body:JSON.stringify(payload)
});
}catch{
throw new Error('Network error');
}

if(!res.ok){
throw new Error('Submission failed');
}
}

form.addEventListener('submit', async(e)=>{
e.preventDefault();
errorEl.textContent='';

const data = Object.fromEntries(new FormData(form).entries());

const payload = {
submission_id: makeId(),
...data,
source: 'website_strategy_session'
};

try{
await submitQualification(payload);
form.style.display='none';
success.style.display='block';
}catch(err){
errorEl.textContent = err.message;
}
});
</script>

</body>
</html>
